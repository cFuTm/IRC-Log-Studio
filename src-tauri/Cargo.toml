[package]
name = "irc-log-studio"
version = "0.2.0"
description = "An offline IRC log editor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
